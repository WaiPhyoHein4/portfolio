<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wai Phyo Hein | Automotive Engineering Portfolio</title>
<meta name="description" content="Portfolio of Wai Phyo Hein, Automotive Engineering student at Kasetsart University: Formula Student, EV engineering, CAD and achievements.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--card:#121826;--line:#1f2a3d;--tx:#e8edf6;--mu:#93a1ba;--ac:#ff6a2b;--ac2:#22d3ee;color-scheme:dark;box-sizing:border-box}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6fb;--card:#fff;--line:#dde3ef;--tx:#101828;--mu:#5b6882;--ac:#e8500f;--ac2:#0891b2;color-scheme:light}}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.sg{font-family:'Space Grotesk',Inter,sans-serif;line-height:1.15}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}
.wrap{max-width:1120px;margin:auto;padding:0 22px}
header{position:fixed;top:0;left:0;right:0;z-index:20;padding:env(safe-area-inset-top,0px) 0 0;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nv{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:700;font-size:19px;color:var(--tx);text-decoration:none}.logo b{color:var(--ac)}
nav{display:flex;gap:20px}nav a{color:var(--mu);text-decoration:none;font-size:14px;font-weight:500;transition:.2s}nav a:hover{color:var(--ac)}
@media(max-width:620px){nav{gap:13px}nav a{font-size:13px}.logo span{display:none}}
section{padding:90px 0 30px}
.hero{min-height:100vh;display:flex;align-items:center;padding-top:100px}
.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
@media(max-width:820px){.hg{grid-template-columns:1fr}.pic{order:-1;max-width:290px;margin:auto}}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--ac2);border:1px solid var(--line);padding:6px 14px;border-radius:99px;background:var(--card)}
.pill i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e;animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px transparent}}
h1{font-size:clamp(38px,7vw,68px);margin:18px 0 8px;letter-spacing:-1.5px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 5s linear infinite}
@keyframes gs{to{background-position:200%}}
.role{font-size:clamp(18px,3vw,24px);color:var(--mu);min-height:1.6em}.role b{color:var(--tx);font-weight:500}
.cur{display:inline-block;width:2px;height:1em;background:var(--ac);margin-left:3px;vertical-align:-2px;animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}
.tag{margin:18px 0 26px;color:var(--mu);max-width:540px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);color:var(--tx);background:var(--card);cursor:pointer;font-family:inherit;transition:.25s}
.btn:hover{transform:translateY(-3px);border-color:var(--ac)}
.btn.p{background:linear-gradient(135deg,var(--ac),#ff9a3c);color:#fff;border:0;box-shadow:0 8px 28px -8px var(--ac)}
.btn[disabled]{opacity:.5;pointer-events:none}
.pic{position:relative;aspect-ratio:4/5;width:100%}
.pic::before{content:"";position:absolute;inset:-14px;border-radius:32px;background:conic-gradient(from 0deg,var(--ac),var(--ac2),var(--ac));filter:blur(22px);opacity:.45;animation:sp 8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pic img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:26px;border:3px solid var(--card);display:block;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.pic .chg{position:absolute;z-index:3;bottom:12px;left:50%;transform:translateX(-50%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:20px}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.st b{display:block;font:700 34px 'Space Grotesk',sans-serif;color:var(--ac)}.st span{color:var(--mu);font-size:14px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:26px}.sh h2{font-size:clamp(28px,5vw,40px)}.sh i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ab{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}@media(max-width:820px){.ab{grid-template-columns:1fr}}
.bx{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.bx p{color:var(--mu);margin-bottom:12px}.bx h3{margin-bottom:14px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{padding:6px 13px;border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,transparent);border:1px solid color-mix(in srgb,var(--ac) 30%,transparent);font-size:13px}
.chips.b span{background:color-mix(in srgb,var(--ac2) 12%,transparent);border-color:color-mix(in srgb,var(--ac2) 30%,transparent)}
.lv{margin-bottom:13px}.lv div{display:flex;justify-content:space-between;gap:10px;font-size:14px}.lv small{color:var(--mu);font-size:12.5px;text-align:right}.lv u{display:block;height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.lv i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1.3s .3s cubic-bezier(.2,.8,.2,1)}.rv.in .lv i{width:var(--w)}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.tb{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mu);font:500 14px Inter,sans-serif;cursor:pointer;transition:.25s}
.tb:hover{color:var(--tx);border-color:var(--ac)}.tb.on{background:linear-gradient(135deg,var(--ac),#ff9a3c);color:#fff;border-color:transparent}
.tb small{opacity:.75;margin-left:5px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;animation:pop .5s both;transition:transform .25s,border-color .25s,box-shadow .25s;transform-style:preserve-3d}
.cd:hover{border-color:var(--ac);box-shadow:0 18px 40px -18px var(--ac)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.im{aspect-ratio:4/3;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 25%,var(--card)),color-mix(in srgb,var(--ac2) 25%,var(--card)));display:grid;place-items:center;font-size:54px;cursor:default;overflow:hidden}
.im.z{cursor:zoom-in}.im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.cd:hover .im img{transform:scale(1.07)}
.cb{padding:16px 18px}.cb h4{font:600 17px 'Space Grotesk',sans-serif;margin-bottom:4px}.cb p{color:var(--mu);font-size:14px}
.ed{outline:1px dashed var(--ac);outline-offset:3px;border-radius:4px;min-height:1.3em;cursor:text}.ed:empty::before{content:attr(data-ph);color:var(--mu);opacity:.7}
.ctl{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;z-index:2}.ctl button{min-width:36px;height:36px;padding:0 8px;border-radius:50%;border:0;background:rgba(10,13,20,.82);color:#fff;font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}.ctl button:hover{background:var(--ac)}.ctl button[disabled]{opacity:.3;pointer-events:none}.ctl .dl{margin-left:auto;border-radius:99px;background:#ef4444}.ctl .dl.arm{font-size:13px;font-weight:600}
.up{border:2px dashed var(--line);border-radius:18px;min-height:220px;display:grid;place-items:center;text-align:center;color:var(--mu);cursor:pointer;background:transparent;font:inherit;transition:.25s;padding:20px}
.up:hover{border-color:var(--ac);color:var(--ac)}.up b{display:block;font-size:34px}
.emp{grid-column:1/-1;text-align:center;color:var(--mu);padding:46px 10px;border:1px dashed var(--line);border-radius:18px}
.ct{text-align:center;padding:50px 22px}.ct h3{font-size:clamp(24px,4vw,34px);margin-bottom:10px}.ct p{color:var(--mu);margin-bottom:22px}.ct .btns{justify-content:center}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 20px 100px}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;gap:12px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:78vh;border-radius:12px;animation:pop .3s}
#lb p{color:#e8edf6;text-align:center;max-width:640px;font-size:15px}
#lb button{position:absolute;background:#ffffff1f;color:#fff;border:0;width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer}
#lx{top:calc(16px + env(safe-area-inset-top,0px));right:16px}#lp{left:14px}#ln{right:14px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:none;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--ac);box-shadow:0 12px 40px #0008;max-width:94vw;flex-wrap:wrap;justify-content:center}
#bar.on{display:flex}#bar .btn{padding:9px 16px;font-size:14px}#bar span{font-size:13px;color:var(--mu)}
#ts{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;max-width:90vw}#ts.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head>
<body>
<canvas id="bg"></canvas>
<header><div class="wrap nv"><a class="logo sg" href="#home">Wai Phyo Hein<b>.</b></a>
<nav><a href="#about">About</a><a href="#portfolio">Portfolio</a><a href="#contact">Contact</a></nav></div></header>
<main id="app"></main>
<footer>© <span id="yr"></span> Wai Phyo Hein · Automotive Engineering Portfolio</footer>
<div id="lb"><button id="lx" aria-label="Close">✕</button><button id="lp" aria-label="Previous">‹</button><img alt=""><p></p><button id="ln" aria-label="Next">›</button></div>
<div id="bar"><span id="bs">Edit mode</span><button class="btn" id="bx">Done editing</button><button class="btn p" id="bp" disabled>Save &amp; publish</button></div>
<div id="ts"></div>
<input type="file" id="fi" accept="image/*" multiple hidden>
<script src="data.js"></script>
<script>
const PRISTINE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const DEFAULT_PHOTO="images/profile.jpg";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=window.SITE||{profile:{},cats:{certs:[],fsae:[],cad:[],ach:[]}};for(const k in S.cats)S.cats[k].forEach(i=>{i.aid=i.file||''});
const P=S.profile,CATS=[['certs','Certificates','📜','Upload your certificates'],['fsae','Formula Student','🏁','Upload Formula Student photos'],['cad','CAD Drawings','📐','Upload CAD drawings & renders'],['ach','Achievements','🏆','Upload achievement photos']];
let edit=false,canEdit=false,assets=null,art=null,dirty=false,tab='certs',lbList=[],lbI=0,upTarget='';
const src=a=>a.aid||'';
const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)};
const ce=(k,v,ph)=>edit?` contenteditable="true" class="ed" data-ph="${ph}" ${k}`:' '+k;
const photoSrc=()=>P.photo||DEFAULT_PHOTO;
function render(){
$('#yr').textContent=new Date().getFullYear();
$('#app').innerHTML=`
<section class="hero" id="home"><div class="wrap hg"><div>
<span class="pill"><i></i>Open to internships &amp; opportunities</span>
<h1>Hi, I’m <em>Wai Phyo Hein</em></h1>
<div class="role">I am an <b id="ty"></b><span class="cur"></span></div>
<div class="tag"><span${ce('data-p="tagline"','', 'Short tagline')}>${esc(P.tagline)}</span></div>
<div class="btns"><a class="btn p" href="#portfolio">View my work →</a><a class="btn" href="#contact">Get in touch</a></div></div>
<div class="pic"><img src="${photoSrc()}" alt="Portrait of Wai Phyo Hein">${edit?'<button class="btn chg" data-up="photo">Change photo</button>':''}</div></div></section>
<section id="about"><div class="wrap rv"><div class="sh"><h2>About me</h2><i></i></div>
<div class="ab"><div class="bx"><p${ce('data-p="bio1"','','Biography')}>${esc(P.bio1)}</p><p${ce('data-p="bio2"','','More about you')}>${esc(P.bio2)}</p></div>
<div class="bx"><h3>Focus areas</h3><div class="chips"><span>EV Systems</span><span>SolidWorks</span><span>CATIA</span><span>Ansys</span><span>Python / MATLAB</span><span>Fabrication</span><span>Cost Engineering</span></div>
<h3 style="margin-top:20px">Languages</h3><div class="lv" style="--w:90%"><div><b>English</b><small>Advanced · IELTS 7.5 (Reading 8.5)</small></div><u><i></i></u></div><div class="lv" style="--w:75%"><div><b>Japanese</b><small>Upper-intermediate · JLPT N2</small></div><u><i></i></u></div><div class="lv" style="--w:100%"><div><b>Burmese</b><small>Native</small></div><u><i></i></u></div><div class="lv" style="--w:30%"><div><b>Thai</b><small>Basic speaking · learning</small></div><u><i></i></u></div></div></div>
<div class="stats"><div class="st"><b data-n="3.87" data-d="2">0</b><span>GPA out of 4.00</span></div><div class="st"><b data-n="7.5" data-d="1">0</b><span>IELTS overall</span></div><div class="st"><b data-n="14" data-s="+">0</b><span>EV teams outpitched</span></div><div class="st"><b data-n="3" data-s="rd">0</b><span>year, Automotive Eng.</span></div></div></div></section>
<section id="portfolio"><div class="wrap rv"><div class="sh"><h2>Portfolio</h2><i></i></div><div class="tabs" id="tabs"></div><div class="gr" id="gr"></div></div></section>
<section id="contact"><div class="wrap rv"><div class="bx ct"><h3>Let’s build something together</h3><p>Open to internships, projects and collaborations in automotive and EV engineering.</p><div class="btns"><a class="btn p" href="mailto:${esc(P.email)}">✉ Email me</a><a class="btn" href="${esc(P.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a></div></div></div></section>`;
renderGal();typeInit();reveal();counters();
}
function renderGal(){
$('#tabs').innerHTML=CATS.map(c=>`<button class="tb${c[0]===tab?' on':''}" data-t="${c[0]}">${c[2]} ${c[1]}<small>${S.cats[c[0]].length}</small></button>`).join('');
const c=CATS.find(x=>x[0]===tab),L=S.cats[tab];
lbList=L.filter(i=>i.aid);
let h=L.map((i,n)=>`<article class="cd" style="animation-delay:${n*60}ms">${edit?`<div class="ctl"><button data-mv="-1" data-id="${i.id}" title="Move earlier"${n===0?' disabled':''}>◀</button><button data-mv="1" data-id="${i.id}" title="Move later"${n===L.length-1?' disabled':''}>▶</button><button data-rp="${i.id}" title="${i.aid?'Replace':'Add'} photo">📷 ${i.aid?'Replace':'Add photo'}</button><button class="dl" data-del="${i.id}" title="Delete">🗑</button></div>`:''}
<div class="im${i.aid?' z':''}" ${i.aid?`data-z="${i.id}"`:''}>${i.aid?`<img loading="lazy" src="${src(i)}" alt="${esc(i.title||c[1])}">`:c[2]}</div>
<div class="cb"><h4${ce(`data-c="${tab}" data-i="${i.id}" data-k="title"`,'','Add a title')}>${esc(i.title)}</h4><p${ce(`data-c="${tab}" data-i="${i.id}" data-k="desc"`,'','Add a description')}>${esc(i.desc)}</p></div></article>`).join('');
if(edit)h+=`<button class="up" data-up="${tab}"><span><b>＋</b>${c[3]}<br><small>Tap to choose one or more photos</small></span></button>`+(tab==='ach'?`<button class="up" data-add="1"><span><b>✎</b>Add a text entry<br><small>Attach a photo to it afterwards</small></span></button>`:'');
else if(!L.length)h=`<div class="emp">${c[2]}<br>${c[1]} coming soon.</div>`;
$('#gr').innerHTML=h;
}
let tyT;function typeInit(){const W=['Automotive Engineering Student','EV Systems Enthusiast','Formula Student Team Member','CAD &amp; Prototyping Designer'].map(s=>s.replace('&amp;','&')),el=$('#ty');let w=0,c=0,d=1;clearTimeout(tyT);
if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=W[0];return}
(function t(){const s=W[w];c+=d;el.textContent=s.slice(0,c);let dl=d>0?70:35;if(c===s.length){d=-1;dl=1600}else if(c===0){d=1;w=(w+1)%W.length;dl=350}tyT=setTimeout(t,dl)})()}
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.rv').forEach(e=>io.observe(e));setTimeout(()=>document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')),2500)}
function counters(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,n=+el.dataset.n,d=+(el.dataset.d||0),s=el.dataset.s||'',t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1400),v=n*(1-Math.pow(1-p,3));el.textContent=v.toFixed(d)+(p===1?s:'');if(p<1)requestAnimationFrame(f)})(t0)}),{threshold:.5});document.querySelectorAll('[data-n]').forEach(e=>io.observe(e))}
function setDirty(){dirty=true;$('#bp').disabled=false;$('#bs').textContent='Unsaved changes'}
function openLb(i){lbI=i;const it=lbList[i];if(!it)return;const l=$('#lb');$('img',l).src=src(it);$('p',l).textContent=[it.title,it.desc].filter(Boolean).join(' — ');l.classList.add('on');$('#lp').style.display=$('#ln').style.display=lbList.length>1?'':'none'}
const closeLb=()=>$('#lb').classList.remove('on'),stepLb=d=>openLb((lbI+d+lbList.length)%lbList.length);
document.addEventListener('click',e=>{
const t=e.target.closest('[data-t],[data-del],[data-z],[data-up],[data-mv],[data-rp],[data-add]');if(!t)return;
if(t.dataset.t){tab=t.dataset.t;renderGal()}
else if(t.dataset.del){if(!t.classList.contains('arm')){t.classList.add('arm');t.textContent='Sure? Delete';clearTimeout(t._t);t._t=setTimeout(()=>{t.classList.remove('arm');t.textContent='🗑'},3000)}else{const L=S.cats[tab],i=L.findIndex(x=>x.id===t.dataset.del);if(i>-1){L.splice(i,1);renderGal();setDirty();toast('Deleted. Tap Save & publish to make it permanent.')}}}
else if(t.dataset.mv){const L=S.cats[tab],i=L.findIndex(x=>x.id===t.dataset.id),j=i+(+t.dataset.mv);if(i>-1&&j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];renderGal();setDirty()}}
else if(t.dataset.rp){upTarget='rp:'+t.dataset.rp;const f=$('#fi');f.multiple=false;f.click()}
else if(t.dataset.add){S.cats[tab].push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'',desc:'',aid:''});renderGal();setDirty()}
else if(t.dataset.z){const i=lbList.findIndex(x=>x.id===t.dataset.z);if(i>-1)openLb(i)}
else if(t.dataset.up){upTarget=t.dataset.up;const f=$('#fi');f.multiple=upTarget!=='photo';f.click()}});
$('#lx').onclick=closeLb;$('#lp').onclick=e=>{e.stopPropagation();stepLb(-1)};$('#ln').onclick=e=>{e.stopPropagation();stepLb(1)};$('#lb').onclick=e=>{if(e.target.id==='lb')closeLb()};
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')stepLb(-1);if(e.key==='ArrowRight')stepLb(1)});
document.addEventListener('input',e=>{const t=e.target;if(!t.isContentEditable)return;
if(t.dataset.p)P[t.dataset.p]=t.textContent;
else if(t.dataset.i){const it=S.cats[t.dataset.c].find(x=>x.id===t.dataset.i);if(it)it[t.dataset.k]=t.textContent}
setDirty()});
document.addEventListener('paste',e=>{if(e.target.isContentEditable){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.isContentEditable){e.preventDefault();e.target.blur()}});
$('#fi').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length||!assets)return;let ok=0;
for(const f of fs){toast('Uploading '+(ok+1)+' of '+fs.length+'…');try{const r=await assets.upload(f);
if(upTarget==='photo'){P.photoAid=r.id}else if(upTarget.startsWith('rp:')){const it=S.cats[tab].find(x=>x.id===upTarget.slice(3));if(it)it.aid=r.id}else S.cats[upTarget].push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'',desc:'',aid:r.id});ok++}
catch(err){toast('Could not upload '+f.name+': '+((err&&err.message)||'try a smaller image (max 20 MB)'))}}
if(ok){if(upTarget==='photo'){const im=$('.pic img');if(im)im.src=photoSrc()}else{if(!upTarget.startsWith('rp:'))tab=upTarget;renderGal()}setDirty();toast(ok+' photo'+(ok>1?'s':'')+' added. Add captions, then tap Save & publish.')}};
function setEdit(v){edit=v;$('#bar').classList.add('on');$('#bx').textContent=v?'Done editing':'Edit site';document.body.dataset.edit=v;render()}
$('#bx').onclick=()=>setEdit(!edit);
$('#bp').onclick=async()=>{if(!art)return;const b=$('#bp');b.disabled=true;$('#bs').textContent='Publishing…';
try{const json=JSON.stringify(S).replace(/</g,'\\u003c');const re=new RegExp('(<script id="data" type="application/json">)[\\s\\S]*?(<'+'/script>)');
const html=PRISTINE.replace(re,(m,a,z)=>a+json+z);const r=await art.publish(html);dirty=false;if(r&&r.conflict)toast('Page changed elsewhere; reloading latest.')}
catch(err){b.disabled=false;$('#bs').textContent='Save failed. Try again.';toast('Save failed: '+((err&&(err.message||err.code))||'unknown error'))}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
// background
(function(){const cv=$('#bg'),x=cv.getContext('2d');if(!x||matchMedia('(prefers-reduced-motion:reduce)').matches)return;let w,h,ps=[],m={x:-999,y:-999};
const rs=()=>{w=cv.width=innerWidth;h=cv.height=innerHeight;ps=Array.from({length:Math.min(70,Math.floor(w*h/22000))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))};rs();addEventListener('resize',rs);
addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
(function f(){x.clearRect(0,0,w,h);const c=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#ff6a2b';x.fillStyle=c;x.strokeStyle=c;
for(const p of ps){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.globalAlpha=.5;x.beginPath();x.arc(p.x,p.y,1.6,0,7);x.fill()}
for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.globalAlpha=.16*(1-d/130);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
for(const p of ps){const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<150){x.globalAlpha=.3*(1-d/150);x.beginPath();x.moveTo(p.x,p.y);x.lineTo(m.x,m.y);x.stroke()}}
requestAnimationFrame(f)})()})();
// card tilt
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const c=e.target.closest&&e.target.closest('.cd');document.querySelectorAll('.cd.tl').forEach(k=>{if(k!==c){k.classList.remove('tl');k.style.transform=''}});if(!c||edit)return;const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;c.classList.add('tl');c.style.transform=`perspective(800px) rotateY(${px*8}deg) rotateX(${-py*8}deg) translateY(-4px)`});
render();
</script></body></html>
